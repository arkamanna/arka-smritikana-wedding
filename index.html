<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Arka ❤ Smritikana — Wedding Invitation</title>
<meta name="description" content="Wedding invitation of Arka Manna & Smritikana Paik — choose your language" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,400&family=Cinzel:wght@500;600&family=Great+Vibes&family=Noto+Serif+Bengali:wght@500;600;700&family=Baloo+Da+2:wght@600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/style.css" />
</head>
<body class="chooser">

<div class="ornate-frame" aria-hidden="true">
  <span class="corner tl"></span><span class="corner tr"></span>
  <span class="corner bl"></span><span class="corner br"></span>
</div>

<div id="petals" class="petals" aria-hidden="true"></div>
<div class="bg-decor" aria-hidden="true">
  <span class="chakra-wrap left"><img class="chakra" src="assets/chakra-gold.png" alt="" /></span>
  <span class="chakra-wrap right"><img class="chakra" src="assets/chakra-gold.png" alt="" /></span>
</div>
<div class="festoon" aria-hidden="true">
  <span class="wire"></span>
  <span class="fb" style="--l:9%;--t:44px;--w:38px"><img src="assets/bulb-marigold.png" alt="" /></span>
  <span class="fb" style="--l:25%;--t:72px;--w:48px"><img src="assets/bulb-sunflower.png" alt="" /></span>
  <span class="fb" style="--l:41%;--t:92px;--w:40px"><img src="assets/bulb-rose.png" alt="" /></span>
  <span class="fb" style="--l:59%;--t:92px;--w:50px"><img src="assets/bulb-leaf.png" alt="" /></span>
  <span class="fb" style="--l:75%;--t:70px;--w:40px"><img src="assets/bulb-forget.png" alt="" /></span>
  <span class="fb" style="--l:91%;--t:44px;--w:44px"><img src="assets/bulb-marigold.png" alt="" /></span>
</div>

<button id="musicBtn" class="music-btn" title="Music" aria-label="Toggle music"><img class="vinyl" src="assets/vinyl.png" alt="" aria-hidden="true" /><span class="note">♪</span></button>
<audio id="bgAudio" src="assets/bg-music.mp3?v=3" loop preload="auto"></audio>

<main class="choose-wrap">
  <div class="sparkles" id="sparkles" aria-hidden="true"></div>

  <div class="choose-card">
    <div class="intro-motif" aria-hidden="true"></div>
    <p class="choose-sanskrit">॥ শ্রী শ্রী প্রজাপতয়ে নমঃ ॥</p>

    <h1 class="choose-names">
      <span class="cn-bn">অর্ক</span>
      <span class="cn-amp">❋</span>
      <span class="cn-bn">স্মৃতিকণা</span>
    </h1>
    <p class="choose-sub">Arka Manna &nbsp;·&nbsp; Smritikana Paik</p>
    <p class="choose-date">13 – 15 December 2026</p>

    <div class="lotus-divider" aria-hidden="true"></div>
    <p class="choose-prompt">আপনার ভাষা নির্বাচন করুন &nbsp;·&nbsp; Choose your language</p>

    <div class="choose-actions">
      <button type="button" class="choose-btn" data-view="bengali.html">
        <span class="cb-main">বাংলা</span>
        <span class="cb-sub">Bengali Invitation</span>
      </button>
      <button type="button" class="choose-btn alt" data-view="english.html">
        <span class="cb-main en-serif">English</span>
        <span class="cb-sub">English Invitation</span>
      </button>
    </div>
  </div>
</main>

<!-- Content loads here so the music (in this parent shell) never restarts on language switch -->
<iframe id="viewer" class="viewer" title="Invitation"></iframe>

<script src="assets/app.js"></script>
<script>
  (function () {
    var viewer = document.getElementById("viewer");
    var chooser = document.querySelector(".choose-wrap");
    function openView(src) {
      viewer.src = src;
      document.body.classList.add("viewing");
    }
    document.querySelectorAll(".choose-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        openView(btn.getAttribute("data-view"));
      });
    });
    // deep link: index.html#bengali or #english opens directly
    var h = (location.hash || "").replace("#", "");
    if (h === "bengali" || h === "english") openView(h + ".html");
  })();
</script>
</body>
</html>
